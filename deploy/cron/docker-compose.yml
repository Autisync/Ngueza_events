# =====================================================================
# NGUEZA — scheduled jobs (Portainer)
#
# §26 requires that a pending booking stops holding a date: a request
# expires after 48 hours, a payment after 24. The job that releases them
# has to run every few minutes for those deadlines to mean anything.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan
# runs cron jobs once a day, which would leave a date held up to 24 hours
# past its deadline — exactly the failure §26 is about. On Vercel Pro you
# can delete this stack and use the schedule documented in README.md
# instead; both call the same endpoint.
# =====================================================================

services:
  expire-bookings:
    image: curlimages/curl:8.11.1
    container_name: ngueza-cron-expire
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:?set SITE_URL, e.g. https://ngueza.com}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET, matching the app}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "expiry job: every $${INTERVAL_SECONDS}s against $${SITE_URL}"
        while true; do
          body=$$(curl -sS --max-time 30 \
            -H "authorization: Bearer $${CRON_SECRET}" \
            "$${SITE_URL}/api/cron/expire" 2>&1) || body="request failed"
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) $${body}"
          sleep "$${INTERVAL_SECONDS}"
        done

  # §17 — sends whatever is waiting in the notification outbox. A shorter
  # default interval than expiry: a booking's 48-hour deadline does not
  # care if the sweep runs five minutes late, but a client waiting to
  # hear whether their date was accepted does.
  send-notifications:
    image: curlimages/curl:8.11.1
    container_name: ngueza-cron-notify
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:?set SITE_URL, e.g. https://ngueza.com}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET, matching the app}
      NOTIFY_INTERVAL_SECONDS: ${NOTIFY_INTERVAL_SECONDS:-60}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "notify job: every $${NOTIFY_INTERVAL_SECONDS}s against $${SITE_URL}"
        while true; do
          body=$$(curl -sS --max-time 30 \
            -H "authorization: Bearer $${CRON_SECRET}" \
            "$${SITE_URL}/api/cron/notify" 2>&1) || body="request failed"
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) $${body}"
          sleep "$${NOTIFY_INTERVAL_SECONDS}"
        done
