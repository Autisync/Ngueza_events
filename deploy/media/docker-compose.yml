# =====================================================================
# NGUEZA — media stack (Portainer)
#
# Replaces Cloudflare Images + R2 with two containers you host yourself.
# The contract from §40 is unchanged, and it is the contract that matters:
#
#   * The application server NEVER handles image bytes. The browser uploads
#     straight to object storage with a presigned URL.
#   * Images are resized and converted to WebP/AVIF on delivery, not on
#     upload, so one original serves every size.
#   * The database stores an id and nothing heavier.
#
#   minio     S3-compatible object storage      (replaces R2)
#   imgproxy  on-the-fly resize + WebP/AVIF     (replaces Cloudflare Images)
#
# Deploy in Portainer: Stacks -> Add stack -> Repository (or paste this
# file), set the environment variables below, deploy. See README.md next
# to this file.
# =====================================================================

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ngueza-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Public URL the browser will PUT to. Presigned URLs are signed for
      # this exact host, so it must match what the browser actually uses —
      # a mismatch produces SignatureDoesNotMatch and nothing else.
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [media]

  # Creates the bucket and applies a read-only public policy to it, then
  # exits. Runs on every stack start and is idempotent.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ngueza-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-ngueza-media}
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-ngueza-documents}
    # Two buckets, and the difference between them matters.
    #
    #   media      — anonymously readable, so supplier photographs load
    #                straight from storage with no signed URL.
    #   documents  — identity cards, NIFs, commercial registrations. NO
    #                anonymous access. Reachable only through a
    #                short-lived signed URL issued to an administrator.
    #
    # `mc anonymous set none` is applied explicitly rather than relying on
    # the default, so a later MinIO default cannot quietly open it.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MEDIA_BUCKET &&
      mc anonymous set download local/$$MEDIA_BUCKET &&
      mc mb --ignore-existing local/$$DOCUMENTS_BUCKET &&
      mc anonymous set none local/$$DOCUMENTS_BUCKET &&
      echo 'bucket '$$MEDIA_BUCKET' ready' &&
      echo 'bucket '$$DOCUMENTS_BUCKET' ready (private)'
      "
    networks: [media]
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:v3.28
    container_name: ngueza-imgproxy
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # URL signing. Without these, anyone can point imgproxy at any
      # source and burn your CPU resizing other people's images.
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT}

      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${MEDIA_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

      # §41, §42 — most visitors are on mobile data they pay for.
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_QUALITY: "78"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "20971520"   # 20 MB
      IMGPROXY_TTL: "2592000"                  # cache for 30 days
      IMGPROXY_STRIP_METADATA: "true"          # drops EXIF, incl. GPS
      IMGPROXY_STRIP_COLOR_PROFILE: "true"
      IMGPROXY_DOWNLOAD_TIMEOUT: "10"
      IMGPROXY_CONCURRENCY: "${IMGPROXY_CONCURRENCY:-8}"
    ports:
      - "${IMGPROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [media]

volumes:
  minio-data:
    driver: local

networks:
  media:
    driver: bridge
