# =====================================================================
# NGUEZA — media stack (Portainer)
#
# Replaces Cloudflare Images + R2 with two containers you host yourself.
# The contract from §40 is unchanged, and it is the contract that matters:
#
#   * The application server NEVER handles image bytes. The browser uploads
#     straight to object storage with a presigned URL.
#   * Images are resized and converted to WebP/AVIF on delivery, not on
#     upload, so one original serves every size.
#   * The database stores an id and nothing heavier.
#
#   minio     S3-compatible object storage      (replaces R2)
#   imgproxy  on-the-fly resize + WebP/AVIF     (replaces Cloudflare Images)
#
# Deploy in Portainer: Stacks -> Add stack -> Repository (or paste this
# file), set the environment variables below, deploy. See README.md next
# to this file.
# =====================================================================

services:
  minio:
    # Second registry lockout in a row. MinIO pulled both images from
    # Docker Hub's anonymous tier in 2025 (the quay.io comment this
    # replaced), then did the same to quay.io/minio/* on 2026-09-24 —
    # `docker pull quay.io/minio/minio:latest` now 401s anonymously, and
    # so does quay.io/minio/mc, confirmed directly against the registry
    # API, not just this stack. Not a rate limit, not this runner: a
    # fresh CI run against unmodified `main` failed the same way within
    # hours of a run that had been green, and other projects hit the
    # identical 401 the same day.
    #
    # cgr.dev/chainguard/minio is Chainguard's build of the same
    # binaries, still anonymously pullable, and bundles `mc` — which is
    # why minio-init below points at this image too instead of a
    # separate mc image (Chainguard gates cgr.dev/chainguard/mc behind a
    # paid tier; the minio image doesn't need it, it already has mc for
    # its own healthcheck). Pinned by digest rather than `latest`
    # because Chainguard's free tier doesn't publish stable version
    # tags — a bare `latest` would mean CI silently pulls a different
    # build on some future run. Verified end to end before pinning:
    # full stack healthy, both buckets created with the right anonymous
    # policy, and `npm run test:media`'s 12 tests green against it.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: ngueza-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Public URL the browser will PUT to. Presigned URLs are signed for
      # this exact host, so it must match what the browser actually uses —
      # a mismatch produces SignatureDoesNotMatch and nothing else.
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    volumes:
      - minio-data:/data
    ports:
      # Portainer's own UI listens on 9000 (it holds 127.0.0.1:9000 on the
      # production host). When this binding collides, Docker does NOT stop
      # the container: it starts MinIO with no network and no ports at all,
      # it still reports "healthy" (the healthcheck only talks to itself),
      # and every neighbour fails with "lookup minio ... server
      # misbehaving". Production sets MINIO_PORT=9010 — see
      # stack.env.example.
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [media]

  # Creates the bucket and applies a read-only public policy to it, then
  # exits. Runs on every stack start and is idempotent.
  minio-init:
    # Same image as `minio` above, not a separate mc image — see that
    # service's comment. The entrypoint override below is what turns
    # this into a one-shot `mc` job instead of a running server.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: ngueza-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-ngueza-media}
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-ngueza-documents}
    # Two buckets, both private. Kept apart so an identity card can never
    # land in the bucket imgproxy serves from by a naming mistake.
    #
    #   media      — supplier photographs. Visitors only ever see them
    #                through imgproxy, which reads with its own credentials
    #                (below) and strips EXIF on the way out. Until slice 27
    #                this bucket was anonymously readable, which exposed the
    #                ORIGINAL file — GPS coordinates and all — to anyone who
    #                decoded the source path inside an imgproxy URL.
    #   documents  — identity cards, NIFs, commercial registrations, proofs
    #                of payment. Reachable only through a short-lived signed
    #                URL issued to an administrator.
    #
    # `mc anonymous set none` is applied explicitly rather than relying on
    # the default, so a later MinIO default cannot quietly open either. It
    # re-runs on every stack start, so restarting an existing deployment
    # closes a media bucket that an older version of this file opened.
    # The alias step retries for up to a minute: a one-shot job that dies on
    # the first DNS hiccup leaves the buckets uncreated with only a stale
    # log line to show for it. If it still cannot reach minio after that,
    # it says what to check instead of just repeating mc's error.
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then
          echo 'minio-init: cannot reach minio:9000 after 60s.';
          echo 'Check that ngueza-minio is attached to the media network and that MINIO_PORT is not already taken on the host (Portainer uses 9000).';
          mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
          exit 1;
        fi;
        sleep 2;
      done &&
      echo 'alias local ready' &&
      mc mb --ignore-existing local/$$MEDIA_BUCKET &&
      mc anonymous set none local/$$MEDIA_BUCKET &&
      mc mb --ignore-existing local/$$DOCUMENTS_BUCKET &&
      mc anonymous set none local/$$DOCUMENTS_BUCKET &&
      echo 'bucket '$$MEDIA_BUCKET' ready (private)' &&
      echo 'bucket '$$DOCUMENTS_BUCKET' ready (private)'
      "
    networks: [media]
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:v3.28
    container_name: ngueza-imgproxy
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # URL signing. Without these, anyone can point imgproxy at any
      # source and burn your CPU resizing other people's images.
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT}

      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${MEDIA_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

      # §41, §42 — most visitors are on mobile data they pay for.
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_QUALITY: "78"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "20971520"   # 20 MB
      IMGPROXY_TTL: "2592000"                  # cache for 30 days
      IMGPROXY_STRIP_METADATA: "true"          # drops EXIF, incl. GPS
      IMGPROXY_STRIP_COLOR_PROFILE: "true"
      IMGPROXY_DOWNLOAD_TIMEOUT: "10"
      IMGPROXY_CONCURRENCY: "${IMGPROXY_CONCURRENCY:-8}"
    ports:
      - "${IMGPROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [media]

volumes:
  minio-data:
    driver: local

networks:
  media:
    driver: bridge
