# =====================================================================
# NGUEZA — media stack behind an existing Traefik
#
# Add this file to the stack alongside docker-compose.yml (Portainer:
# Stacks -> the stack -> Git repository -> "Additional paths"). It joins
# MinIO and imgproxy to Traefik's Docker network and labels them so
# Traefik routes and issues certificates for the two hostnames. Neither
# container needs a host port reachable from outside once this is on.
#
# Read the four values from a container Traefik already routes
# (Portainer -> Containers -> it -> Labels), or from Traefik's own
# command line:
#   TRAEFIK_NETWORK        the Docker network Traefik is attached to
#   TRAEFIK_ENTRYPOINT     the HTTPS entrypoint, often `websecure` or `https`
#   TRAEFIK_CERTRESOLVER   the ACME resolver, often `letsencrypt` or `le`
#   MEDIA_HOST, IMG_HOST   the two public names
#
# No body-size middleware: Traefik does not limit request bodies unless
# told to, and the 20 MB cap on uploads is enforced by the presigned URL.
# =====================================================================

services:
  minio:
    networks: [media, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
      - traefik.http.routers.ngueza-media.rule=Host(`${MEDIA_HOST:?set MEDIA_HOST}`)
      - traefik.http.routers.ngueza-media.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ngueza-media.tls=true
      - traefik.http.routers.ngueza-media.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.ngueza-media.service=ngueza-media
      # Only the S3 API. The console (9001) stays off the internet.
      - traefik.http.services.ngueza-media.loadbalancer.server.port=9000

  imgproxy:
    networks: [media, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
      - traefik.http.routers.ngueza-img.rule=Host(`${IMG_HOST:?set IMG_HOST}`)
      - traefik.http.routers.ngueza-img.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ngueza-img.tls=true
      - traefik.http.routers.ngueza-img.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.ngueza-img.service=ngueza-img
      - traefik.http.services.ngueza-img.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
