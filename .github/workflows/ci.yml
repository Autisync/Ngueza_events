name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: schema, RLS and concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE: ngueza_test

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Migrations apply cleanly from empty
        run: ./scripts/db-reset.sh
        env:
          PGDATABASE: ngueza_ci

      # The gate that matters: double-booking, tenant isolation, and the
      # 50-way race. A failure here is a security or correctness bug, not
      # a style opinion.
      - name: Database assertions
        run: ./scripts/db-test.sh

      - name: Seed the test database for integration tests
        run: WITH_REFERENCE=1 WITH_DEMO=1 ./scripts/db-reset.sh
        env:
          PGDATABASE: ngueza_test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Types match the schema
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # The waitlist acceptance criteria, against a real database and a
      # real outbox — double opt-in, idempotent confirmation, one-click
      # unsubscribe, and no enumeration of the list.
      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ngueza_test

      # The media stack, for real. imgproxy signing and SigV4 presigning
      # are the kind of thing that is either exactly right or completely
      # broken, and unit tests cannot tell the difference on their own.
      - name: Start MinIO and imgproxy
        working-directory: deploy/media
        run: cp dev.env .env && ./wait-ready.sh

      # No env overrides: the suite defaults to the same values as
      # deploy/media/dev.env, which is what the stack was started with.
      # Overriding one and not the other is how this failed the first time.
      - name: Media round-trip
        run: npm run test:media

      - name: Stop the media stack
        if: always()
        working-directory: deploy/media
        run: docker compose down -v

      # Deliberately WITHOUT DATABASE_URL. A page that queries the database
      # at build time freezes its content at deploy — the sitemap did
      # exactly that, so a supplier verified an hour after a release stayed
      # invisible to Google until the next one. Keep this step database-free
      # so that mistake cannot come back.
      - name: Production build (must not need a database)
        run: npm run build

      - name: No secret reached the client bundle
        run: |
          # Next only inlines NEXT_PUBLIC_* into client code, but assert it
          # against the real build output rather than trusting the rule.
          test -d .next/static || { echo "no client bundle to check"; exit 1; }
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY\|MEDIA_SECRET_ACCESS_KEY\|IMGPROXY_SALT" .next/static 2>/dev/null; then
            echo "::error::A server secret reached the client bundle."; exit 1
          fi
          echo "client bundle carries no server secrets"

      - name: spec/schema.sql is in sync with the migrations
        run: |
          ./scripts/schema-dump.sh
          if ! git diff --quiet -- spec/schema.sql; then
            echo "::error::spec/schema.sql is stale. Run: npm run schema:dump"
            git diff -- spec/schema.sql | head -40
            exit 1
          fi

  forbidden-patterns:
    name: forbidden patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rules in CLAUDE.md that can be checked mechanically. Each of
      # these is a shortcut that is cheap now and a rewrite later.
      # A write-then-read in the same expression truncated README.md to
      # zero bytes once and it was committed unnoticed. Cheap to catch.
      - name: No tracked file is empty
        run: |
          # No pipeline into a loop: Actions runs `bash -e`, and an `&&`
          # chain returning non-zero for every NON-empty file kills the
          # subshell before it can report anything. `if` inside a plain
          # for-loop cannot trip -e.
          empty=""
          for f in $(git ls-files); do
            if [ -f "$f" ] && [ ! -s "$f" ]; then empty="$empty $f"; fi
          done
          if [ -n "$empty" ]; then
            echo "::error::empty tracked files:$empty"; exit 1
          fi
          echo "no empty tracked files"

      - name: No category or location enums
        run: |
          if grep -rniE "create type .*(category|location).* as enum" supabase/ ; then
            echo "::error::Categories and locations are rows, never enums (§44)."; exit 1
          fi

      - name: No floating-point money
        run: |
          if grep -rniE "(price|amount|total)_(minor|cents)?[a-z_]* +(numeric|real|double|float|decimal)" supabase/migrations/ ; then
            echo "::error::Money is bigint minor units. No floats, ever."; exit 1
          fi

      - name: No OFFSET pagination
        run: |
          if grep -rniE "\boffset +[0-9$:]" --include=*.ts --include=*.tsx --include=*.sql \
               supabase/ scripts/ 2>/dev/null; then
            echo "::error::Use keyset pagination, not OFFSET."; exit 1
          fi

      # The old version of this check matched path names, which is a guess.
      # A module holding a secret is now marked `server-only`, so importing
      # it from a client component fails the BUILD — verified by deliberately
      # doing it. This step only enforces that the marks stay put.
      # `process.env.X ?? fallback` only falls back on null/undefined, never
      # on ''. Every platform sets a declared-but-blank variable to '', so
      # the fallback silently does not apply — which is how new URL('')
      # took down a production build. Use env()/optionalEnv() from lib/env.
      - name: No ?? fallback on an environment variable
        run: |
          if grep -rnE "process\.env\.[A-Z_]+ +\?\?" --include='*.ts' --include='*.tsx' \
               app lib 2>/dev/null | grep -v '^lib/env.ts:'; then
            echo "::error::Use env() or optionalEnv() from lib/env — '??' does not catch a blank value."
            exit 1
          fi
          echo "no ?? fallbacks on environment variables"

      - name: Modules holding secrets are marked server-only
        run: |
          missing=0
          for f in lib/db.ts lib/supabase.ts lib/media.ts lib/email.ts \
                   lib/newsletter.ts lib/booking.ts lib/provider.ts \
                   lib/search.ts lib/session.ts lib/auth.ts \
                   lib/onboarding.ts lib/painel.ts; do
            if ! head -5 "$f" | grep -q "import 'server-only'"; then
              echo "::error file=$f::$f holds secrets or bypasses RLS and must import 'server-only'"
              missing=1
            fi
          done
          exit $missing

      - name: Every table has row-level security
        run: |
          missing=0
          for t in $(grep -rhoE "^create table ([a-z_]+)" supabase/migrations/ | awk '{print $3}'); do
            # Across ALL migrations, not just 0011: a table added later
            # enables its own RLS in its own file, and pinning this to one
            # file made the check pass while missing exactly that case.
            if ! grep -qrE "alter table $t +enable row level security" supabase/migrations/; then
              echo "::error::table '$t' has no RLS"; missing=1
            fi
          done
          exit $missing
